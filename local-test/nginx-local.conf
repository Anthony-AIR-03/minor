# Lokale kopie van nginx/default.conf, maar dan op HTTPS (zelfgemaakt certificaat) en zonder Cloudflare/rate limit.
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8k;
    absolute_redirect off;
    if ($request_uri ~ "^(.*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    location = /api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/share/nginx/html/api.php;
        fastcgi_pass minor-php:9000;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.    { return 404; }
    location ^~ /local-test/ { return 404; }   # testopzet zelf niet serveren

    location / {
        try_files $uri $uri/ =404;
    }
}
