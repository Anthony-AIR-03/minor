# LOKALE testomgeving voor de basisskilltree (bijeenkomst 4). Nooit naar main mergen.
# Start met: local-test/run.sh up   →   https://localhost:8443/games/skilltree/
#
# Zelfde opbouw als compose.yml (nginx + PHP-api + MariaDB), maar:
# - HTTPS op localhost:8443 met een zelfgemaakt certificaat (api.php accepteert alleen een https-origin);
# - de site wordt read-only uit de repo gemount, de skilltree uit local-test/skilltree;
# - een eigen testdatabase in een Docker-volume, met tabel en beperkte gebruiker uit init.sql.
name: minor-local-test

services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ..:/usr/share/nginx/html   # zonder :ro, anders kan games/skilltree niet als koppelpunt worden aangemaakt
      - ./skilltree:/usr/share/nginx/html/games/skilltree:ro
      - ./harness:/usr/share/nginx/html/test-harness:ro
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - minor-php

  minor-php:
    build:
      context: ..
      dockerfile: Dockerfile.php
    volumes:
      - ./db-config.local.php:/usr/share/nginx/private/db-config.php:ro
    depends_on:
      - db

  db:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: local-root-only
      MARIADB_DATABASE: skilltree
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - testdb:/var/lib/mysql

volumes:
  testdb:
