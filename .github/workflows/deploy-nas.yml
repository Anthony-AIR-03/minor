name: Deploy to NAS

# Auto-deploys the minor stack (static site + PHP API + MariaDB + phpMyAdmin) to a self-hosted NAS
# runner after a push to main. Everything builds directly on the NAS - there is no separate image
# build step and no registry involved.
#
# Runner: a dedicated self-hosted runner registered to THIS repo, labelled `minor`, running on the
# NAS as a low-privilege deploy account in the `docker` group. One-time setup:
# docs/runbooks/nas-runner-setup.md.
#
# Repo Variable `NAS_DEPLOY_DIR` = the absolute deploy directory on the NAS (kept out of git -
# concrete value lives in the operator's own notes). NAS prerequisites (one-time, see the runbook):
#   - $NAS_DEPLOY_DIR/.env                        (MariaDB root password)
#   - $NAS_DEPLOY_DIR/private/db-config.php       (DB DSN/user/password/origin for api.php)
#   - $NAS_DEPLOY_DIR/private/docent.htpasswd     (teacher login for /docent-dashboard/, htpasswd -B)
#   - the external `npm` Docker network exists (shared with Nginx Proxy Manager)
# Optional: $NAS_DEPLOY_DIR/media/ holds large media that are kept out of git (the full-quality ON AIR
# videos). nginx serves it at /media/; when a file is missing the pages fall back to the smaller
# version in git, so a missing media/ only gives a warning.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-nas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, minor]
    timeout-minutes: 15
    env:
      DEPLOY_DIR: ${{ vars.NAS_DEPLOY_DIR }}

    steps:
      - name: Check configuration
        run: |
          if [ -z "${{ vars.NAS_DEPLOY_DIR }}" ]; then
            echo "::error::repo Variable NAS_DEPLOY_DIR is not set (Settings -> Secrets and variables -> Actions -> Variables)"
            exit 1
          fi
          if [ ! -f "${{ vars.NAS_DEPLOY_DIR }}/.env" ] || [ ! -f "${{ vars.NAS_DEPLOY_DIR }}/private/db-config.php" ]; then
            echo "::error::$DEPLOY_DIR is missing .env or private/db-config.php - one-time setup not done yet (docs/runbooks/nas-runner-setup.md)"
            exit 1
          fi
          # Without it Docker would bind-mount an empty directory and the teacher dashboard would only return 500s.
          if [ ! -s "${{ vars.NAS_DEPLOY_DIR }}/private/docent.htpasswd" ]; then
            echo "::error::$DEPLOY_DIR/private/docent.htpasswd is missing - create the teacher login first (docs/runbooks/nas-runner-setup.md)"
            exit 1
          fi
          # Not an error: the video players fall back to the smaller files in git.
          if [ -z "$(ls -A "${{ vars.NAS_DEPLOY_DIR }}/media" 2>/dev/null)" ]; then
            echo "::warning::$DEPLOY_DIR/media/ is missing or empty - the site falls back to the smaller videos in git (copy the full-quality files there, see docs/runbooks/nas-runner-setup.md)"
          fi

      - uses: actions/checkout@v4

      - name: Sync the repo to the NAS deploy directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          # --delete keeps the deploy dir a mirror of the commit; the excludes are host-only state that
          # must survive every redeploy: .env, private/db-config.php and private/docent.htpasswd hold
          # secrets that are never in git, and db/ is MariaDB's live data directory (created by the
          # container, not by a checkout). media/ holds the full-quality videos that are copied to the NAS
          # by hand and never in git; rsync doesn't read .gitignore, so without this exclude --delete would
          # wipe them on every deploy.
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'private/db-config.php' \
            --exclude 'private/docent.htpasswd' \
            --exclude 'db/' \
            --exclude '/media/' \
            ./ "$DEPLOY_DIR/"
          # Create media/ as the deploy user before compose bind-mounts it; otherwise Docker creates it
          # owned by root and files can't be copied into it without sudo.
          mkdir -p "$DEPLOY_DIR/media"

          # This NAS's umask yields modes the containers (running as their own UIDs, e.g. php-fpm's
          # www-data) can't read after a plain rsync. Force world read + directory-traverse across the
          # tree, but never touch the excluded paths above - db/ especially, since MariaDB manages its
          # own data-directory permissions and a blanket chmod there can break it. media/ deliberately
          # does get the chmod: nginx must be able to read the hand-copied videos, and a+r is harmless.
          find "$DEPLOY_DIR" \( -name db -o -name .env -o -path "$DEPLOY_DIR/private/db-config.php" \) -prune -o -type d -exec chmod a+rx {} + 2>/dev/null || true
          find "$DEPLOY_DIR" \( -name db -o -name .env -o -path "$DEPLOY_DIR/private/db-config.php" \) -prune -o -type f -exec chmod a+r {} + 2>/dev/null || true
          # Best-effort re-lock of the two secret files; a no-op if they're not owned by this user.
          chmod 600 "$DEPLOY_DIR/.env" 2>/dev/null || true
          chmod 640 "$DEPLOY_DIR/private/db-config.php" 2>/dev/null || true

      - name: Build and start the stack
        working-directory: ${{ env.DEPLOY_DIR }}
        # --pull refreshes the php/nginx base images so upstream security fixes land on every deploy
        # instead of reusing whatever the NAS has cached. phpMyAdmin is pulled explicitly for the same
        # reason; mariadb:lts is deliberately left out, since that tag can jump to a new major version.
        run: |
          docker compose build --pull
          docker compose pull minor-pma
          docker compose up -d --remove-orphans

      - name: Diagnostics on failure
        if: failure()
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose ps || true
          docker compose logs --tail 60 || true

      - name: Wait for the API to report ready
        run: |
          ok=""
          for _ in $(seq 1 30); do
            if docker run --rm --network npm curlimages/curl:8.10.1 -sf "http://minor/api.php?action=health" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::api.php did not report healthy within ~90s"
            exit 1
          fi
          echo "API healthy."

      - name: Deployment summary
        if: always()
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose ps
