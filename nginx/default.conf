# Rate limit per bezoeker: 10 verzoeken/seconde doorlopend, piek van 40 direct toegestaan.
# gedeeld IP kan dus gewoon tegelijk testen; alleen scripts/floods worden geblokkeerd.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

# HTML, JS en CSS altijd opnieuw laten controleren (304 als er niks veranderd is), zodat een deploy
# meteen zichtbaar is. Zonder eigen header zet Cloudflare er 4 uur browsercache op, en raadt de browser
# zelf hoe lang hij HTML bewaart: dan draaien bezoekers uren na een deploy nog de oude pagina.
# Leeg = geen header, dus afbeeldingen/audio/downloads houden de gewone cache.
map $sent_http_content_type $cache_control {
    ~^text/html               "no-cache";
    ~^text/css                "no-cache";
    ~javascript               "no-cache";
    default                   "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nette URL's: /games/x/ in plaats van /games/x/index.html.
    # Redirects relatief houden, zodat ze achter de reverse proxy niet naar http://...:80 wijzen
    # (nginx stuurt /games/x zelf al door naar /games/x/).
    absolute_redirect off;
    # Oude links met index.html doorsturen. $request_uri is de oorspronkelijke URL, dus de interne
    # index-lookup van een map triggert dit niet opnieuw (geen redirect-loop).
    if ($request_uri ~ "^(.*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }
    client_max_body_size 8k;
    add_header Cache-Control $cache_control;

    # Echte bezoekers-IP (anders zien we alleen het Docker-IP van NPM en delen ALLE bezoekers 1 limiet)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;

    location = /api.php {
        limit_req zone=api burst=40 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/share/nginx/html/api.php;
        fastcgi_pass minor-php:9000;
    }

    location ~ \.php$ { return 404; }   # geen andere PHP-bestanden
    location ~ /\.    { return 404; }   # .git, .env, ...

    location / {
        try_files $uri $uri/ =404;
    }
}